name: Build APK (arm64-v8a)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android packages (API 34, build-tools, NDK 26, CMake 3.22)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          which sdkmanager
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/26.1.10909125" >> local.properties
          ls "$ANDROID_HOME/ndk/26.1.10909125" | head

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Assemble arm64-v8a debug APK
        run: gradle :app:assembleDebug --stacktrace --info

      - name: List APKs
        run: ls -lh app/build/outputs/apk/debug/ || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flytomoon-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
